[pytest]
# asyncio_mode=auto yeu cau plugin pytest-asyncio (nam trong requirements.txt).
# Neu chay lenh test ma bao "unknown config option: asyncio_mode" hoac
# "async def functions are not natively supported", nghia la pytest-asyncio
# chua duoc cai trong moi truong dang dung.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = backend/tests
addopts = -q
